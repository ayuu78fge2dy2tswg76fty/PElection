<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | P-Election</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(15, 23, 42, 0.8);
            --panel-border: rgba(148, 163, 184, 0.16);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-2: #38bdf8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 30%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 25%),
                linear-gradient(135deg, #050816 0%, #0f172a 45%, #111827 100%);
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }
        .shell {
            width: 100%;
            max-width: 600px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: center;
            justify-items: center;
        }
        .hero,
        .card {
            border: 1px solid var(--panel-border);
            background: var(--panel);
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            width: 100%;
            max-width: 500px;
        }
        .hero {
            padding: 42px;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            text-align: center;
        }
        .hero::after {
            content: "";
            position: absolute;
            inset: auto -80px -90px auto;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.28), transparent 70%);
            filter: blur(8px);
            display: none;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #f8fafc;
            justify-content: center;
        }
        .brand-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
        }
        .hero h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.03;
            margin: 24px 0 12px;
            text-align: center;
            width: 100%;
        }
        .hero p {
            margin: 0 auto;
            max-width: 40ch;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1rem;
            text-align: center;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 28px;
            position: relative;
            z-index: 1;
            width: 100%;
        }
        .stat {
            padding: 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .stat strong {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .stat span {
            color: var(--muted);
            font-size: 0.88rem;
        }
        .card {
            padding: 34px;
            text-align: center;
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 1.7rem;
            text-align: center;
        }
        .card .sub {
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.6;
            text-align: center;
        }
        .messages {
            display: grid;
            gap: 10px;
            margin-bottom: 18px;
            justify-items: center;
        }
        .message {
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            border: 1px solid transparent;
            text-align: center;
            width: 100%;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.24);
        }
        .message.error {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.24);
        }
        .message.info {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.24);
        }
        .field {
            margin-bottom: 16px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .field input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(15, 23, 42, 0.72);
            color: var(--text);
            border-radius: 16px;
            padding: 14px 16px 14px 46px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: rgba(56, 189, 248, 0.65);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
        }
        .field input::placeholder {
            color: #64748b;
        }
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 22px;
        }
        .btn {
            border: none;
            cursor: pointer;
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            flex: 0 1 auto;
            color: #04111a;
            background: linear-gradient(135deg, #7cfdac, #38bdf8);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.22);
            padding: 14px 40px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(56, 189, 248, 0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .hint {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.6;
            text-align: center;
        }
        .hint strong {
            color: #f8fafc;
        }
        @media (max-width: 920px) {
            .shell {
                grid-template-columns: 1fr;
            }
            .hero {
                min-height: auto;
            }
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
  
        <section class="card">
            <h2>Sign in</h2>
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="field">
                    <label for="identifier">Username or Email</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="identifier" name="identifier" placeholder="admin or admin@example.com" autocomplete="username" required>
                    </div>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </button>
                </div>
            </form>
     
        </section>
    </div>
</body>
</html>
